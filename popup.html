<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MySitePeak</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="MySitePeak logo">
    <h1>MySitePeak</h1>
  </div>
  <div class="content">
    <div class="site-card">
      <div class="site-label">CURRENT WEBSITE</div>
      <div class="site-domain" id="site-domain">Loading...</div>
      <div class="site-url" id="site-url"></div>
    </div>

    <div id="result-card" class="neutral">
      <div class="risk-title" id="risk-title">Analyzing...</div>
      <div class="risk-subtitle" id="risk-subtitle"></div>
    </div>

    <ul id="reasons"></ul>

    <button id="scan-again">↻ Scan Again</button>
  </div>
  <div class="footer">Private. Local. Phishing Protection.</div>

  <script src="heuristics.js"></script>
  <script src="js_features.js"></script>
  <script src="ml_predict.js"></script>
  <script src="known_domains_check.js"></script>
  <script src="popup.js"></script>
</body>
</html>
